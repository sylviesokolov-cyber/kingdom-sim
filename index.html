<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Kingdom Simulator</title>
    <meta name="description" content="A mobile kingdom simulation game where you rise from refugee peasant through work, trade, crime, faith, and politics to the royal throne." />
    <meta property="og:title" content="Kingdom Simulator" />
    <meta property="og:description" content="A mobile kingdom simulation game where you rise from refugee peasant through work, trade, crime, faith, and politics to the royal throne." />
    <meta property="og:type" content="website" />

    <!-- PWA & Android Landscape Fullscreen Settings -->
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Valenreach" />
    <meta name="screen-orientation" content="landscape" />
    <meta name="x5-orientation" content="landscape" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Compatibility bridge for the existing bond-scene handler. It resolves the NPC
      // from the active bond modal's character image without changing gameplay state.
      Object.defineProperty(window, 'activeSceneNpcId', {
        configurable: true,
        get() {
          const modal = document.querySelector('.fixed.inset-0.z-50');
          const image = modal?.querySelector('img[alt]');
          const name = image?.getAttribute('alt') || '';
          const ids = {
            Mira: 'mira',
            Caren: 'caren',
            Bran: 'bran',
            Lyra: 'lyra',
            Sylvie: 'sylvie',
            Torvin: 'torvin',
            Elena: 'elena',
            Valerius: 'valerius',
            Vesper: 'vesper',
          };
          return ids[name] || '';
        },
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
