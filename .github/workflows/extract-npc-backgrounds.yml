name: Extract NPC backgrounds

on:
  push:
    paths:
      - 'kingdom_sim_npc_character_backgrounds_upscaled_2x.zip'
      - '.github/workflows/extract-npc-backgrounds.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract backgrounds
        run: |
          mkdir -p public/characters/backgrounds
          unzip -o kingdom_sim_npc_character_backgrounds_upscaled_2x.zip -d public/characters/backgrounds
          find public/characters/backgrounds -type f -name '*.webp' -print

      - name: Commit extracted backgrounds and remove archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/characters/backgrounds/*.webp
          git rm kingdom_sim_npc_character_backgrounds_upscaled_2x.zip
          git rm .github/workflows/extract-npc-backgrounds.yml
          git commit -m 'Extract NPC character backgrounds' || exit 0
          git push
