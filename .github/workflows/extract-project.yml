name: Extract Kingdom Sim project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract uploaded project
        run: |
          if [ ! -f kingsim-main.zip ]; then
            echo "No ZIP to extract."
            exit 0
          fi

          rm -rf kingsim-main
          unzip -q kingsim-main.zip

          if [ -d kingsim-main ]; then
            cp -a kingsim-main/. .
            rm -rf kingsim-main
          fi

          rm -f kingsim-main.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract Kingdom Sim project"
          git push
