name: Kingdom Sim CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract uploaded NPC backgrounds
        if: ${{ hashFiles('kingdom_sim_npc_character_backgrounds_upscaled_2x.zip') != '' }}
        run: |
          mkdir -p public/characters/backgrounds
          unzip -o kingdom_sim_npc_character_backgrounds_upscaled_2x.zip -d public/characters/backgrounds
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/characters/backgrounds/*.webp
          git rm kingdom_sim_npc_character_backgrounds_upscaled_2x.zip
          git rm .github/workflows/extract-npc-backgrounds.yml || true
          git commit -m 'Extract NPC character backgrounds' || true
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build
