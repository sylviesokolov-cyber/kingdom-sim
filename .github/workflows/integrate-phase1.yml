name: Integrate Phase 1 Simulation

on:
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - '.github/workflows/integrate-phase1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate Phase 1 simulation engine') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace legacy day advancement with simulation engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          marker = '  // Advance Day / Rest Engine\n'
          end = '  // Perform Job\n'
          start = s.index(marker)
          finish = s.index(end, start)
          new_block = '''  // Advance Day / Rest Engine — centralized Phase 1 simulation\n  const advanceDay = () => {\n    const result = simulateDay({\n      day,\n      player,\n      kingdom,\n      npcs,\n      marketPrices,\n    });\n\n    setDay(result.day);\n    setSeason(result.season);\n    setPlayer(result.player);\n    setKingdom(result.kingdom);\n    setNpcs(result.npcs);\n    setMarketPrices(result.marketPrices);\n\n    if (result.shouldTriggerEvent) {\n      const randomEvent = RANDOM_EVENTS[result.eventIndex % RANDOM_EVENTS.length];\n      if (randomEvent) {\n        setActiveEvent(randomEvent);\n        sound.playAlert();\n      }\n    } else {\n      showToast(`Dawn arrives on Day ${result.day}! Energy restored.`);\n    }\n  };\n\n'''
          s = s[:start] + new_block + s[finish:]
          import_line = "import { simulateDay } from './engine/simulation/dailySimulation';\n"
          if import_line not in s:
              anchor = "import { sound } from './utils/audio';\n"
              s = s.replace(anchor, anchor + import_line, 1)
          p.write_text(s)
          PY

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Integrate Phase 1 simulation engine'
          git push
