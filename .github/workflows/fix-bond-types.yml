name: Fix bond scene TypeScript compatibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix bond scene TypeScript compatibility')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          old = "const handleCompleteBondScene = (sceneId: string, reward: any) => {"
          start = text.index(old)
          end = text.index("\n  // Commit Crime", start)
          replacement = '''const handleCompleteBondScene = (scene: BondScene, earnedAffection: number, statGains?: { stat: 'might' | 'cunning' | 'authority' | 'piety'; value: number }) => {
            const sceneId = scene.id;
            const reward = scene.reward;
            const alreadyCompleted = (player.completedBondSceneIds || []).includes(sceneId);

            if (!alreadyCompleted) {
              setPlayer((prev) => {
                const currentStats = prev.stats || { level: 1, exp: 0, maxExp: 100, might: 14, cunning: 16, authority: 12, piety: 10 };
                const newStats = { ...currentStats };
                if (statGains) newStats[statGains.stat] += statGains.value;
                return {
                  ...prev,
                  copper: prev.copper + (reward.copperBonus || 0),
                  maxEnergy: prev.maxEnergy + (reward.maxEnergyBonus || 0),
                  energy: Math.min(prev.maxEnergy + (reward.maxEnergyBonus || 0), prev.energy + (reward.maxEnergyBonus || 0)),
                  stats: newStats,
                  completedBondSceneIds: [...(prev.completedBondSceneIds || []), sceneId],
                  activePerks: (prev.activePerks || []).includes(reward.perkId)
                    ? (prev.activePerks || [])
                    : [...(prev.activePerks || []), reward.perkId],
                };
              });

              if (earnedAffection > 0) {
                setNpcs((prevNpcs) => prevNpcs.map((n) =>
                  n.id === scene.npcId
                    ? { ...n, affection: Math.min(100, (n.affection || 0) + earnedAffection) }
                    : n
                ));
              }

              if (reward.statBonus) {
                setPlayer((prev) => ({
                  ...prev,
                  stats: {
                    ...(prev.stats || { level: 1, exp: 0, maxExp: 100, might: 14, cunning: 16, authority: 12, piety: 10 }),
                    [reward.statBonus!.stat]: (prev.stats?.[reward.statBonus!.stat] || 0) + reward.statBonus!.value,
                  },
                }));
              }

              showToast(`✨ Covenant Bond Fulfilled! Received: ${reward.title}`);
            }
            setActiveBondScene(null);
          };'''
          app.write_text(text[:start] + replacement + text[end:])

          data = Path('src/data/bondScenesData.ts')
          d = data.read_text()
          d = d.replace("reactionEmotion: 'determined'", "reactionEmotion: 'serious'")
          data.write_text(d)
          PY
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/data/bondScenesData.ts
          git diff --cached --quiet || git commit -m "Fix bond scene TypeScript compatibility"
          git push
